version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: examguard
      POSTGRES_PASSWORD: password
      POSTGRES_DB: examguard
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  backend:
    build: ./backend
    command: node src/server.js
    environment:
      - DATABASE_URL=postgres://examguard:password@db:5432/examguard
      - JWT_SECRET=your_jwt_secret_here
    ports:
      - '4000:4000'
    depends_on:
      - db
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
volumes:
  db_data:
